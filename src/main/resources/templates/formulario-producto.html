<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id} == null ? 'New Product' : 'Edit Product'">Product Form</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="main-content">
    <div class="form-page">
        <h1 th:text="${product.id} == null ? '➕ New Product' : '✏️ Edit Product'"></h1>

        <div class="form-card">
            <form th:action="@{/products/save}" th:object="${product}" method="post" class="product-form">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" th:field="*{name}" placeholder="e.g. Nike Air Max" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Price (€) *</label>
                        <input type="number" step="0.01" th:field="*{price}" placeholder="0.00" required min="0" />
                    </div>
                    <div class="form-group">
                        <label>Stock</label>
                        <input type="number" th:field="*{stock}" placeholder="0" min="0" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <input type="text" th:field="*{category}" placeholder="e.g. Electronics, Clothing..." list="categories-list" />
                    <datalist id="categories-list">
                        <option th:each="cat : ${categories}" th:value="${cat}"></option>
                    </datalist>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea th:field="*{description}" rows="3" placeholder="Short product description..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Save Product</button>
                    <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="/js/theme.js"></script>
</body>
</html>

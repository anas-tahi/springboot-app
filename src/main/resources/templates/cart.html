<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | ShopCart</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main class="main-content">
    <div class="page-header">
        <h1>🛒 Your Cart</h1>
        <a th:href="@{/cart/clear}" class="btn btn-danger btn-sm"
           th:if="${not #lists.isEmpty(cartItems)}"
           onclick="return confirm('Clear entire cart?')">🗑️ Clear All</a>
    </div>

    <div class="cart-layout" th:if="${not #lists.isEmpty(cartItems)}">
        <div class="cart-items">
            <div class="cart-item" th:each="item : ${cartItems}">
                <div class="cart-item-info">
                    <span class="cart-item-category" th:text="${item.product.category ?: 'General'}"></span>
                    <h3 th:text="${item.product.name}"></h3>
                    <p class="cart-item-desc" th:text="${item.product.description}"></p>
                    <span class="cart-item-price" th:text="'€' + ${#numbers.formatDecimal(item.product.price, 1, 2)} + ' each'"></span>
                </div>
                <div class="cart-item-controls">
                    <form th:action="@{/cart/decrement/{id}(id=${item.product.id})}" method="post" style="display:inline">
                        <button type="submit" class="qty-btn">−</button>
                    </form>
                    <span class="qty-display" th:text="${item.quantity}"></span>
                    <a th:href="@{/cart/add/{id}(id=${item.product.id})}" class="qty-btn">+</a>
                    <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-danger btn-sm remove-btn">🗑️</button>
                    </form>
                </div>
                <div class="cart-item-subtotal">
                    <span th:text="'€' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span>
                </div>
            </div>
        </div>

        <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Items (<span th:text="${cartCount}"></span>)</span>
                <span th:text="'€' + ${#numbers.formatDecimal(total, 1, 2)}"></span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span class="free-shipping">FREE</span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-total">
                <span>Total</span>
                <span th:text="'€' + ${#numbers.formatDecimal(total, 1, 2)}"></span>
            </div>
            <button class="btn btn-primary btn-block checkout-btn" onclick="alert('Checkout coming soon! 🚀')">
                Proceed to Checkout
            </button>
            <a th:href="@{/products}" class="btn btn-secondary btn-block">← Continue Shopping</a>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(cartItems)}">
        <div class="empty-icon">🛒</div>
        <h2>Your cart is empty</h2>
        <p>Add some products to get started</p>
        <a th:href="@{/products}" class="btn btn-primary">Browse Products</a>
    </div>
</main>

<script src="/js/theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShopCart</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #fff;
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-logo { font-size: 2.5rem; text-align: center; margin-bottom: 8px; }
        .login-title { text-align: center; font-size: 1.6rem; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .login-subtitle { text-align: center; color: #6c757d; font-size: 0.9rem; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #333; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4361ee; }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #4361ee;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .btn-login:hover { background: #3651d4; transform: translateY(-1px); }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-error { background: #fee; color: #c0392b; border: 1px solid #fcc; }
        .alert-success { background: #efe; color: #27ae60; border: 1px solid #cfc; }
        .login-footer { text-align: center; margin-top: 24px; font-size: 0.82rem; color: #999; }
        .credentials-hint {
            background: #f0f4ff;
            border: 1px solid #c7d2fe;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #4361ee;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">🛍️</div>
    <h1 class="login-title">ShopCart</h1>
    <p class="login-subtitle">Sign in to manage your store</p>

    <div th:if="${param.error}" class="alert alert-error">
        ❌ Invalid username or password
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        ✅ You have been logged out successfully
    </div>

    <div class="credentials-hint">
        Demo: <strong>admin</strong> / <strong>admin</strong>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-login">Sign In →</button>
    </form>

    <div class="login-footer">© 2025 ShopCart by Anas Tahir</div>
</div>
</body>
</html>
